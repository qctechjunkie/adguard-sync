services:
  adguardhome-sync:
    image: ghcr.io/bakito/adguardhome-sync
    container_name: adguardhome-sync
    command: run
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Origin (Primary) AdGuard Home Instance
      ORIGIN_URL: ${ORIGIN_URL}
      ORIGIN_USERNAME: ${ORIGIN_USERNAME}
      ORIGIN_PASSWORD: ${ORIGIN_PASSWORD}
      # ORIGIN_WEB_URL: ${ORIGIN_WEB_URL}

      # Replica 1 AdGuard Home Instance
      REPLICA1_URL: ${REPLICA1_URL}
      REPLICA1_USERNAME: ${REPLICA1_USERNAME}
      REPLICA1_PASSWORD: ${REPLICA1_PASSWORD}
      # REPLICA1_API_PATH: ${REPLICA1_API_PATH}
      # REPLICA1_WEB_URL: ${REPLICA1_WEB_URL}
      # REPLICA1_AUTO_SETUP: ${REPLICA1_AUTO_SETUP}
      # REPLICA1_INTERFACE_NAME: ${REPLICA1_INTERFACE_NAME}
      # REPLICA1_DHCP_SERVER_ENABLED: ${REPLICA1_DHCP_SERVER_ENABLED}

      # Optional: Replica 2 AdGuard Home Instance
      # REPLICA2_URL: ${REPLICA2_URL}
      # REPLICA2_USERNAME: ${REPLICA2_USERNAME}
      # REPLICA2_PASSWORD: ${REPLICA2_PASSWORD}
      # REPLICA2_API_PATH: ${REPLICA2_API_PATH}
      # REPLICA2_WEB_URL: ${REPLICA2_WEB_URL}
      # REPLICA2_AUTO_SETUP: ${REPLICA2_AUTO_SETUP}
      # REPLICA2_INTERFACE_NAME: ${REPLICA2_INTERFACE_NAME}
      # REPLICA2_DHCP_SERVER_ENABLED: ${REPLICA2_DHCP_SERVER_ENABLED}

      # Sync Configuration
      CRON: ${CRON:-0 */2 * * *}
      RUN_ON_START: ${RUN_ON_START:-true}
      # CONTINUE_ON_ERROR: ${CONTINUE_ON_ERROR:-false}

      # API/Web Interface Configuration
      API_PORT: ${API_PORT:-8080}
      # API_DARK_MODE: ${API_DARK_MODE}
      # API_USERNAME: ${API_USERNAME}
      # API_PASSWORD: ${API_PASSWORD}
      # API_TLS_CERT_DIR: ${API_TLS_CERT_DIR}
      # API_TLS_CERT_NAME: ${API_TLS_CERT_NAME}
      # API_TLS_KEY_NAME: ${API_TLS_KEY_NAME}
      # API_METRICS_ENABLED: ${API_METRICS_ENABLED}

      # Sync Features (all enabled by default)
      FEATURES_GENERAL_SETTINGS: ${FEATURES_GENERAL_SETTINGS:-true}
      FEATURES_QUERY_LOG_CONFIG: ${FEATURES_QUERY_LOG_CONFIG:-true}
      FEATURES_STATS_CONFIG: ${FEATURES_STATS_CONFIG:-true}
      FEATURES_CLIENT_SETTINGS: ${FEATURES_CLIENT_SETTINGS:-true}
      FEATURES_SERVICES: ${FEATURES_SERVICES:-true}
      FEATURES_FILTERS: ${FEATURES_FILTERS:-true}
      FEATURES_DHCP_SERVER_CONFIG: ${FEATURES_DHCP_SERVER_CONFIG:-true}
      FEATURES_DHCP_STATIC_LEASES: ${FEATURES_DHCP_STATIC_LEASES:-true}
      FEATURES_DNS_SERVER_CONFIG: ${FEATURES_DNS_SERVER_CONFIG:-true}
      FEATURES_DNS_ACCESS_LISTS: ${FEATURES_DNS_ACCESS_LISTS:-true}
      FEATURES_DNS_REWRITES: ${FEATURES_DNS_REWRITES:-true}
      FEATURES_THEME: ${FEATURES_THEME:-true}
    ports:
      - 8090:${API_PORT:-8080}
    restart: unless-stopped